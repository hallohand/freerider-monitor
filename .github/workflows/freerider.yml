name: Freerider Monitor

on:
  schedule:
    # Alle 5 min — innerhalb jedes Runs läuft ein 4-Minuten-Watch-Loop,
    # so dass der Bot praktisch jede Minute reagiert (Latenz max ~1 min)
    # ohne sich auf GH's unzuverlässige minütige Schedules zu verlassen.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freerider-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout monitor repo (code)
        uses: actions/checkout@v4

      - name: Checkout state repo (private)
        uses: actions/checkout@v4
        with:
          repository: hallohand/freerider-monitor-state
          token: ${{ secrets.STATE_REPO_TOKEN }}
          path: state-repo

      - name: Run monitor (5-Iterations-Watch-Loop)
        env:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_KEY }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          STATE_FILE: state-repo/state/known-ids.txt
          LAST_UPDATE_FILE: state-repo/state/last-update-id.txt
          FILTERS_FILE: state-repo/state/filters.json
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::Iteration $i / 5"
            ./freerider-monitor-telegram.sh
            echo "::endgroup::"
            [ "$i" -lt 5 ] && sleep 60
          done

      - name: Commit state-changes (state-repo)
        working-directory: state-repo
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "state: aktualisiert ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "Keine State-Änderungen."
          fi
