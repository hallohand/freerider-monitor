name: Freerider Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freerider-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout monitor repo (code)
        uses: actions/checkout@v4

      - name: Checkout state repo (private)
        uses: actions/checkout@v4
        with:
          repository: hallohand/freerider-monitor-state
          token: ${{ secrets.STATE_REPO_TOKEN }}
          path: state-repo

      - name: Run monitor
        env:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_KEY }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          STATE_FILE: state-repo/state/known-ids.txt
        run: ./freerider-monitor-telegram.sh

      - name: Commit state-changes (state-repo)
        working-directory: state-repo
        run: |
          if [[ -n "$(git status --porcelain state/known-ids.txt)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/known-ids.txt
            git commit -m "state: known-ids aktualisiert ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "Keine State-Änderungen."
          fi
